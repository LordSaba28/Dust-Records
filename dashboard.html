<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Artist Dashboard — Dust Records</title>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=JetBrains+Mono:wght@400;500&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="./assets/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="./assets/css/all.min.css">
  <link rel="stylesheet" href="./assets/css/style.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dust">
    <div class="container">
      <a class="navbar-brand" href="index.html"><img src="./assets/images/DUST_flex.png" alt="DUST"></a>
      <div class="navbar-search">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="search" placeholder="Search songs or artists">
      </div>
      <div class="ms-auto">
        <a href="signin.html" class="btn-dust btn-sm">Sign out</a>
      </div>
    </div>
  </nav>

  <section class="section" style="padding-top: 7rem;">
    <div class="container">
      <div class="section-label font-mono mb-2">Artist Portal</div>
      <h1 class="font-fraunces mb-4">Dashboard</h1>
      <p class="text-ash mb-5">Placeholder dashboard. Upload music, view stats, and manage your profile here in the full version.</p>

      <div class="row g-4">
        <div class="col-md-4">
          <div class="p-4" style="background:#111; border-radius:12px; border:1px solid rgba(242,237,228,0.08);">
            <div class="font-mono text-dust mb-2">Tracks</div>
            <div class="display-6">12</div>
            <small class="text-ash">Uploaded</small>
          </div>
        </div>
        <div class="col-md-4">
          <div class="p-4" style="background:#111; border-radius:12px; border:1px solid rgba(242,237,228,0.08);">
            <div class="font-mono text-dust mb-2">Plays</div>
            <div class="display-6">48.2k</div>
            <small class="text-ash">This month</small>
          </div>
        </div>
        <div class="col-md-4">
          <div class="p-4" style="background:#111; border-radius:12px; border:1px solid rgba(242,237,228,0.08);">
            <div class="font-mono text-dust mb-2">Bookings</div>
            <div class="display-6">3</div>
            <small class="text-ash">Pending</small>
          </div>
        </div>
      </div>

      <div class="mt-5 p-4" style="background:#111; border-radius:12px;">
        <h5 class="mb-3">Quick Upload</h5>
        <form onsubmit="return false;">
          <div class="mb-3"><input type="text" class="form-control" placeholder="Track title"></div>
          <div class="mb-3"><input type="file" class="form-control" accept="audio/*"></div>
          <button class="btn-dust">Upload (placeholder)</button>
        </form>
      </div>
    </div>
  </section>

  <button class="chatbot-btn"><i class="fa-solid fa-comment"></i></button>
  <script src="./assets/js/main.js"></script>
</body>
</html>
