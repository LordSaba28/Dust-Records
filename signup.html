<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create account — Dust Records</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=JetBrains+Mono:wght@400;500&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="./assets/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="./assets/css/style.css">
  <style>
    body { background: #070707; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .auth-card {
      background: #111;
      border: 1px solid rgba(242,237,228,0.08);
      border-radius: 16px;
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    }
    .auth-logo { width: 42px; height: 42px; margin-bottom: 1.25rem; }
    .auth-card h1 { font-family: 'Fraunces', serif; font-size: 1.75rem; margin-bottom: 0.4rem; }
    .auth-card p.lead { color: #A39A8C; font-size: 0.95rem; margin-bottom: 1.75rem; }
    .auth-card label { font-size: 0.85rem; color: #F2EDE4; margin-bottom: 0.35rem; display: block; }
    .auth-card .form-control {
      background: #1A1A1A; border: 1px solid rgba(242,237,228,0.12); color: #F2EDE4;
      border-radius: 8px; padding: 0.7rem 0.9rem;
    }
    .auth-btn { background: #C9A86C; color: #111; border: none; border-radius: 999px; padding: 0.75rem; font-weight: 600; width: 100%; margin-top: 0.5rem; }
    .auth-footer { text-align: center; margin-top: 1.25rem; font-size: 0.85rem; color: #A39A8C; }
    .auth-footer a { color: #C9A86C; }
  </style>
</head>
<body>
  <div class="auth-card">
    <img src="./assets/images/DUST_flex.png" alt="DUST" class="auth-logo">
    <h1>Create an account</h1>
    <p class="lead">Join DUST Records to stay connected with the label.</p>
    <form onsubmit="return false;">
      <div class="mb-3">
        <label>Email</label>
        <input type="email" class="form-control">
      </div>
      <div class="mb-4">
        <label>Password</label>
        <input type="password" class="form-control">
      </div>
      <button type="submit" class="auth-btn">Create account</button>
    </form>
    <div class="auth-footer">
      Already have an account? <a href="signin.html">Sign in</a>
    </div>
  </div>
</body>
</html>
